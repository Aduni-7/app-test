
name: app ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t geoai-app:latest .

      - name: Run Docker Container
        run: docker run -d --rm -p 3000:3000 --name geoai-container geoai-app:latest

      - name: Wait for server boot
        run: |
          for i in {1..10}; do
            if curl -sSf http://localhost:3000/ >/dev/null; then
              echo "server up"
              break
            fi
            echo "waiting..."
            sleep 2
          done

      - name: Test Endpoints via Curl
        run: |
          echo "Testing Root Endpoint..."
          curl -f http://localhost:3000/
          
          echo "Testing Health Endpoint..."
          curl -f http://localhost:3000/health
          
          echo "Testing GeoAI Analysis Endpoint..."
          curl -f http://localhost:3000/api/geoai/analysis

      - name: View Container Logs on Failure
        if: failure()
        run: docker logs geoai-container

      - name: Cleanup container
        if: always()
        run: |
          docker ps -a --filter "name=geoai-container" --format '{{.ID}}' | xargs -r docker rm -f
